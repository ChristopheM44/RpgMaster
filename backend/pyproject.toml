[project]
name = "rpgmaster-backend"
version = "0.1.0"
description = "AI-powered D&D 5.2 Game Master - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "ollama>=0.4.0",
    "openai>=1.30.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pypdf>=6.0.0",
]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/engine/adventure_seeds.py" = ["E501"]
# UP042 (str + Enum → StrEnum) volontairement ignoré sur ces enums *persistés*.
# Ils sont sérialisés en base (colonnes SQLAlchemy `Enum` → `.name`) et en
# JSON/API (toujours via `.value`). Passer à `StrEnum` changerait `str(membre)`
# de "Cls.A" à "a" : neutre ici (aucune dépendance à cette forme hors `__repr__`)
# mais sans bénéfice fonctionnel et risqué pour des données déjà persistées.
# On conserve donc `class X(str, Enum)`. Les nouveaux enums ailleurs gardent le
# rappel StrEnum.
"app/engine/ability_checks.py" = ["UP042"]
"app/engine/conditions.py" = ["UP042"]
"app/game/constants.py" = ["UP042"]
"app/models/message.py" = ["UP042"]
"app/models/session.py" = ["UP042"]
"app/schemas/equipment.py" = ["UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_llm: requires the configured live LLM provider and fails if it is unavailable",
]
